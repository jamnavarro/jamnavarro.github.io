<!DOCTYPE html>
<html lang="en">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jam navarro</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/images.css">
    <link rel="stylesheet" href="../css/container.css">
    <link rel="stylesheet" href="../css/lines.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/accordion.css">

    <link rel="icon" type="image/x-icon" href="/media/icons/favicon.svg">

    <!-- JS -->
    <script defer src="../js/gsap.min.js"></script>

<body>

    <div class="transition-overlay"></div>
    <div class="cursor"></div>

    <div class="navbar">
        <a href="/" class="nav-logo">
            <img src="/media/icons/nav-logo.svg" alt="Home">
        </a>

        <div class="nav-link-container">
            <a href="/" class="nav-link">work</a>
            <a href="/playground/" class="nav-link active">playground</a>
            <a href="/about/" class="nav-link">about</a>
            <div class="nav-underline" aria-hidden="true"></div>
        </div>
    </div>

    <div class="body-container">
        <div class="project-container">
            <div class="h1-line-container">
                <h1>Playground</h1>
                <div class="dark-divider"></div>
            </div>
            
        </div>

        <div class="text-container reg">

            <h3>Some of what I create for fun...</h3>

            <div class="text-container reg">
                <h2>Digital Illustrations</h2>
                <br>
                
                <div class="half-image-container">
                    <img src="/playground/images/bedruthan-steps-poster.png" class="project-image half left">    
                    <img src="/playground/images/iguazufalls-poster.png" class="project-image half right">    
                </div>
                <br>
                <img src="/playground/images/horse.png" class="project-image">
                <br>
                <img src="/playground/images/cat.png" class="project-image">
            </div>

            <div class="dark-divider"></div>

            <div class="text-container reg">
                <h2>Illustrated Posters for Local Musical Productions</h2>
                <br>
                <div class="half-image-container">
                    <img src="/playground/images/shrek-jr.png" class="project-image half left">   
                    <img src="/playground/images/willy-wonka.png"  class="project-image half right">
                </div>
                <br>
                <img src="/playground/images/percy-jackson.png"  class="project-image">   
            </div>

            <div class="dark-divider"></div>

            <div class="text-container reg">
                <h2>Explorations in Unity + Aseprite</h2>
                <br>
                <video autoplay loop src="/playground/images/nuclear-summer.mp4" class="project-image"></video>
            </div>

            <div class="dark-divider"></div>

            <div class="text-container reg">
                <h2>Procedural Environments in Blender</h2>
                <br>
                
                <div class="half-image-container">
                    <img src="/playground/images/blender-render1.jpeg" class="project-image half left">    
                    <img src="/playground/images/blender-render2.png" class="project-image half right">    
                </div>
            </div>

        </div>
        
    </div>

    <div class="dark-divider"></div>

    <footer class="footer">
        <div>
            <br>
            <br>
            <h3><a href="https://www.linkedin.com/in/jam-navarro/">LinkedIn <img src="../media/icons/arrow.svg"></a></h3>
        </div>
        <div>
            <p>Jam Navarro</p>
        </div>
    </footer>
